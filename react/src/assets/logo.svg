<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyber-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow-adv" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Central Neural Core -->
  <circle cx="256" cy="256" r="40" fill="url(#cyber-gradient)" filter="url(#glow-adv)" opacity="0.9">
    <animate attributeName="r" values="40;45;40" dur="4s" repeatCount="indefinite" />
     <animate attributeName="opacity" values="0.9;0.6;0.9" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Orbital Rings representing the G shape and connectivity -->
  <!-- Outer G Arc -->
  <path d="M 360 160 A 140 140 0 1 0 360 352 L 256 352" 
        stroke="url(#cyber-gradient)" 
        stroke-width="50" 
        stroke-linecap="round"
        fill="none" 
        filter="url(#glow-adv)" />

  <!-- Connecting Nodes -->
  <circle cx="360" cy="160" r="25" fill="#22d3ee" />
  <circle cx="116" cy="256" r="20" fill="#06b6d4" />
  <circle cx="360" cy="352" r="25" fill="#3b82f6" />
  
  <!-- Neural Network Lines connecting core to ring -->
  <line x1="256" y1="256" x2="360" y2="160" stroke="#22d3ee" stroke-width="8" stroke-opacity="0.6" stroke-dasharray="10 10" />
  <line x1="256" y1="256" x2="116" y2="256" stroke="#06b6d4" stroke-width="8" stroke-opacity="0.6" stroke-dasharray="10 10" />
  <line x1="256" y1="256" x2="360" y2="352" stroke="#3b82f6" stroke-width="8" stroke-opacity="0.6" stroke-dasharray="10 10" />

</svg>
